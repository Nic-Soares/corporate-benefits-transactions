[project]
name = "corporate-benefits-transactions"
version = "1.0.0"
description = "Synthetic dataset of Brazilian corporate benefits card transactions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "mimesis>=22.2",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
# uv run benefits setup | simulate | etl | export (same as python -m src.main)
benefits = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network and not db'"
markers = [
    "network: calls an external API (run with -m network)",
    "db: needs the Postgres container (run with -m db)",
]
