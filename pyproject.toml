[project]
name = "corporate-benefits-transactions"
version = "0.1.0"
description = "Synthetic dataset of Brazilian corporate benefits card transactions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "faker>=40.44.0",
    "geopandas>=1.2.0",
    "kagglehub>=1.0.3",
    "mimesis>=18,<19",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "python-ulid>=4.1.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "typing-extensions>=4.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
