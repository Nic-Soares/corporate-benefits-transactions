name: Release

# Keeps a release PR open on main with the next version (Semantic Versioning,
# from the Conventional Commit types since the last tag) and CHANGELOG.md.
# Merging it tags vX.Y.Z and publishes the GitHub Release. Runs with its own
# token: PRs opened with GITHUB_TOKEN don't trigger CI, so the `check` job
# would never run on them (docs/runbooks/releases.md).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
