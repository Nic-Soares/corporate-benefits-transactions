name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The OLTP database of the pipeline, as in docker-compose.yaml
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: benefits
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: transactions_benefits_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U benefits -d transactions_benefits_db"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DB_USER: benefits
      DB_PASSWORD: ci-only

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Python version comes from .python-version
      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Tests
        run: uv run pytest

      - name: Database tests
        run: uv run pytest -m db

      # The whole pipeline on 30 days, with the export's quality checks
      - name: Pipeline
        run: |
          uv run python -m src.main setup --seed 42 --today 2026-09-01
          uv run python -m src.main simulate --seed 42 --today 2026-09-01 --days 30
          uv run python -m src.main etl
          uv run python -m src.main export
