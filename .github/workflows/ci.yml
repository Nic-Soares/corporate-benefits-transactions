name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Python version comes from .python-version
      - run: uv sync --locked

      - name: Format
        run: uv run ruff format --check

      # `ruff check` joins once EP-03 brings the findings to zero
      - name: Tests
        run: uv run pytest
