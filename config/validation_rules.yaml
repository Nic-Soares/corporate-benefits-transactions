# =====================================
# validation_rules.yaml
# Transaction validation and authorization rules
# Every check that approves or declines a transaction (src/validators/)
# =====================================

# Order the validation groups run in (cheapest first)
validation_order:
  - "status_validations"
  - "temporal_validations" 
  - "business_rules_validations"
  - "balance_and_limits_validations"
  - "infrastructure_validations"

# =====================================
# Status validations
# =====================================
status_validations:
  card_status:
    description: "Card must be active"
    table: "cards"
    field: "status"
    required_value: "active"
    error_codes:
      inactive: "13"    # card inactive
      blocked: "14"     # card blocked
      cancelled: "15"   # card cancelled

  cardholder_status:
    description: "Cardholder must be active"
    table: "cardholders"
    field: "status"
    required_value: "active"
    error_codes:
      inactive: "16"    # cardholder inactive
      terminated: "17"  # cardholder terminated

  establishment_status:
    description: "Establishment must be active"
    table: "establishments"
    field: "status"
    required_value: "active"
    error_codes:
      inactive: "19"    # establishment inactive
      suspended: "20"   # establishment suspended
      terminated: "21"  # establishment closed

  terminal_status:
    description: "Terminal must be active"
    table: "terminals"
    field: "status"
    required_value: "active"
    error_codes:
      inactive: "22"    # terminal inactive
      maintenance: "22" # terminal under maintenance

  card_product_status:
    description: "Product on the card must be active"
    table: "card_products"
    field: "status"
    required_value: "active"
    error_codes:
      suspended: "23"   # card product inactive
      cancelled: "23"   # card product inactive

  product_active:
    description: "Product must be active"
    table: "products"
    field: "active"
    required_value: true
    error_codes:
      false: "24"       # product disabled

  modality_active:
    description: "Modality must be active"
    table: "transaction_modalities"
    field: "active"
    required_value: true
    error_codes:
      false: "25"       # modality disabled

  acquirer_active:
    description: "Acquirer must be active"
    table: "acquirers"
    field: "active"
    required_value: true
    error_codes:
      false: "26"       # acquirer disabled

# =====================================
# Temporal validations
# =====================================
temporal_validations:
  card_expiration:
    description: "Card must not be expired"
    table: "cards"
    field: "expiration_date"
    rule: "transaction_date <= expiration_date"
    error_code: "54"    # card expired

  cardholder_admission:
    description: "Cardholder must already be hired"
    table: "cardholders"
    field: "admission_date"
    rule: "transaction_date >= admission_date"
    error_code: "56"    # before admission

  establishment_accreditation:
    description: "Establishment must already be accredited"
    table: "establishments"
    field: "accreditation_date"
    rule: "transaction_date >= accreditation_date"
    error_code: "57"    # before accreditation

  terminal_installation:
    description: "Terminal must already be installed"
    table: "terminals"
    field: "installation_date"
    rule: "transaction_date >= installation_date"
    error_code: "58"    # before installation

# =====================================
# Business-rule validations (network routing: MCC for brands, CNAE for OWN)
# =====================================
business_rules_validations:
  mcc_modality_mapping:
    description: "The brand must accept the establishment's MCC"
    applies_to: "branded_cards"  # modality type "brand" (Visa, Mastercard, Elo)
    validation:
      - "MCC × modality exists in mcc_modalities"
      - "mcc_modalities.active = true"
    error_code: "27"    # MCC not accepted by the brand

  cnae_product_mapping:
    description: "The establishment's CNAE must accept the product"
    applies_to: "proprietary_network_cards"  # modality type "proprietary_network" (OWN)
    validation:
      - "longest CNAE prefix × product exists in cnae_products"
      - "cnae_products.active = true"
    error_code: "28"    # CNAE doesn't accept the product

  mcc_modality_rules_active:
    description: "The MCC × modality rule must be active"
    table: "mcc_modalities"
    field: "active"
    required_value: true
    error_code: "29"    # MCC rule disabled

  cnae_product_rules_active:
    description: "The CNAE × product rule must be active"
    table: "cnae_products"
    field: "active"
    required_value: true
    error_code: "30"    # CNAE rule disabled

# =====================================
# Balance and limit validations
# =====================================
balance_and_limits_validations:
  current_balance:
    description: "Enough balance on the card product"
    table: "card_products"
    field: "current_balance"
    rule: "current_balance >= transaction_amount"
    error_code: "51"    # insufficient balance

  daily_limit:
    description: "Daily limit not exceeded"
    table: "card_products"
    field: "daily_limit"
    rule: "daily_usage + transaction_amount <= daily_limit"
    condition: "daily_limit > 0"  # a limit of 0 means no limit
    error_code: "61"    # daily limit exceeded

  monthly_limit:
    description: "Monthly limit not exceeded"
    table: "card_products"
    field: "monthly_limit"
    rule: "monthly_usage + transaction_amount <= monthly_limit"
    condition: "monthly_limit > 0"  # a limit of 0 means no limit
    error_code: "62"    # monthly limit exceeded

# =====================================
# Infrastructure validations
# =====================================
infrastructure_validations:
  capture_type_support:
    description: "The terminal type must support the capture technology"
    # transactions.capture_type holds a code from pre_populated_data.yaml → transaction_technologies
    supported_by_terminal_type:
      POS: ["CHIP", "MAG_STRIPE", "CONTACTLESS", "MOBILE_NFC", "APPLE_PAY", "GOOGLE_PAY"]
      TEF: ["CHIP", "MAG_STRIPE"]
    error_code: "32"    # capture technology not supported

# =====================================
# A referenced record is missing
# (the schema's foreign keys prevent it; guards against inconsistent data)
# =====================================
not_found:
  card: "92"
  card_product: "93"
  cardholder: "94"
  modality: "95"
  establishment: "97"
  terminal: "98"
  acquirer: "99"

# A status missing from the rule's error_codes
unknown_status: "96"

# =====================================
# Validation runtime settings
# =====================================
# Not read by the code yet (EP-08).
validation_config:
  timeout_ms: 3000
  
  async_validations:
    - "status_validations"
    - "temporal_validations"
  
  cached_validations:
    - "mcc_modality_mapping"
    - "cnae_product_mapping"
  
  realtime_validations:
    - "current_balance"
    - "daily_limit"
    - "monthly_limit"

# =====================================
# Per-product rules
# =====================================
# Not read by the code yet (EP-08); the CNAE rule already restricts each
# product to its establishments.
product_specific_rules:
  VA:  # Vale Alimentação
    additional_validations:
      - "cnae_food_only"
    restricted_hours: null
    weekend_allowed: true
    
  VR:  # Vale Refeição
    additional_validations:
      - "cnae_restaurant_only"
    restricted_hours: null
    weekend_allowed: true
    
  VC:  # Vale Combustível
    additional_validations:
      - "cnae_gas_station_only"
    restricted_hours: null
    weekend_allowed: true
    
  VF:  # Vale Farmácia
    additional_validations:
      - "cnae_pharmacy_only"
    restricted_hours: null
    weekend_allowed: true

  VM:  # Multibenefícios
    additional_validations: []
    restricted_hours: null
    weekend_allowed: true

  PR:  # Premiação
    additional_validations: []
    restricted_hours: null
    weekend_allowed: true

