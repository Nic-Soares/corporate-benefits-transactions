# =====================================
# CNAE × products: what the proprietary network authorizes
# =====================================
cnae_products:
  # Longest prefix wins: a 7-digit subclass entry overrides its 4-digit class.
  # VM (multi-benefit) is accepted wherever VA, VR or VF is; PR (incentive) at
  # supermarkets, restaurants and general retail.

  # Supermarkets and hypermarkets
  "4711": ["VA", "VM", "PR"]
  "47113": ["VA", "VM", "PR"]
  "4711301": ["VA", "VM", "PR"]
  "4711302": ["VA", "VM", "PR"]

  # Food retail
  "4721": ["VA", "VM"]        # bakeries, dairy, cold cuts
  "4722": ["VA", "VM"]        # butchers, fishmongers
  "4723": ["VA", "VM"]        # beverages
  "4724": ["VA", "VM"]        # fruit and vegetables
  "4729": ["VA", "VM"]        # other food
  "4729602": ["VA", "VM", "PR"]
  "4729699": ["VA", "VM"]

  # Restaurants and food services
  "5611": ["VR", "VM", "PR"]
  "56112": ["VR", "VM"]
  "5611201": ["VR", "VM"]     # restaurants
  "5611203": ["VR", "VM"]     # snack bars
  "5611204": ["VR", "VM"]     # bars
  "5611205": ["VR", "VM"]     # bars with entertainment
  "5612": ["VR", "VM"]
  "5612100": ["VR", "VM"]     # street food
  "5620": ["VR", "VM"]
  "56201": ["VR", "VM"]
  "5620101": ["VR", "VM"]     # catering for companies
  "5620102": ["VR", "VM"]     # catering for events
  "5620103": ["VR", "VM"]     # canteens
  "5620104": ["VR", "VM"]     # home delivery

  # Fuel stations
  "4731": ["VC"]
  "47318": ["VC"]
  "4731800": ["VC"]

  # Pharmacies
  "4771": ["VF", "VM", "PR"]
  "4771701": ["VF", "VM", "PR"]  # without compounding
  "4771702": ["VF", "VM", "PR"]  # with compounding
  "4771703": ["VF", "VM", "PR"]  # homeopathic

  # General retail
  "4751": ["PR"]              # IT equipment
  "4752": ["PR"]              # telecom equipment
  "4753": ["PR"]              # home appliances
  "4754": ["PR"]              # furniture and lighting
  "4755": ["PR"]              # textiles and household linen
  "4756": ["PR"]              # musical instruments
  "4757": ["PR"]              # parts for home appliances
  "4761": ["PR"]              # books, newspapers, stationery
  "4762": ["PR"]              # music and video recordings
  "4763": ["PR"]              # toys, sports, recreation
  "4772": ["PR"]              # cosmetics and perfume
  "4773": ["PR"]              # medical and orthopedic items
  "4774": ["PR"]              # optical goods
  "4781": ["PR"]              # clothing and accessories
  "4782": ["PR"]              # footwear and leather goods
  "4789": ["PR"]              # other new goods

