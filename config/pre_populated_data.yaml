# CNAE × wallets: what the proprietary network accepts at each establishment
# =====================================
cnae_wallets:
  # Longest prefix wins: a 7-digit subclass entry overrides its 4-digit class,
  # so each entry lists every wallet accepted at that level.

  # Supermarkets and hypermarkets
  "4711": ["FOOD", "GIFT", "PREMIUM"]

  # Food retail
  "4721": ["FOOD", "GIFT"]       # bakeries, dairy, cold cuts
  "4722": ["FOOD", "GIFT"]       # butchers, fishmongers
  "4723": ["FOOD", "GIFT"]       # beverages
  "4724": ["FOOD", "GIFT"]       # fruit and vegetables
  "4729": ["FOOD", "GIFT"]       # other food

  # Restaurants and food services
  "5611": ["MEAL", "GIFT"]       # restaurants, snack bars, bars
  "5612": ["MEAL"]               # street food
  "5620": ["MEAL"]               # catering and canteens

  # Mobility
  "4731": ["MOBILITY"]           # fuel stations
  "4520": ["MOBILITY"]           # vehicle repair and car wash
  "4530": ["MOBILITY"]           # vehicle parts
  "5223": ["MOBILITY"]           # parking

  # Health and wellness
  "4771": ["HEALTH", "GIFT", "PREMIUM"]  # pharmacies
  "4773": ["HEALTH"]             # medical and orthopedic items
  "4774": ["HEALTH", "PREMIUM"]  # optical goods
  "8630": ["HEALTH"]             # outpatient care
  "9313": ["HEALTH"]             # gyms

  # Home office
  "4751": ["HOME_OFFICE", "GIFT", "PREMIUM"]  # IT equipment
  "4752": ["HOME_OFFICE", "GIFT", "PREMIUM"]  # telecom equipment
  "4753": ["HOME_OFFICE", "GIFT", "PREMIUM"]  # home appliances
  "4754": ["HOME_OFFICE", "GIFT", "PREMIUM"]  # furniture and lighting

  # Education
  "4761": ["EDUCATION", "GIFT", "PREMIUM"]    # books, stationery
  "8599": ["EDUCATION"]          # courses and training

  # General retail
  "4755": ["GIFT", "PREMIUM"]    # textiles and household linen
  "4756": ["GIFT", "PREMIUM"]    # musical instruments
  "4762": ["GIFT", "PREMIUM"]    # music and video recordings
  "4763": ["GIFT", "PREMIUM"]    # toys, sports, recreation
  "4772": ["GIFT", "PREMIUM"]    # cosmetics and perfume
  "4781": ["GIFT", "PREMIUM"]    # clothing and accessories
  "4782": ["GIFT", "PREMIUM"]    # footwear and leather goods
  "4789": ["GIFT", "PREMIUM"]    # other new goods

# =====================================
# MCC × wallets: on a brand (4-party) card the issuer picks the wallet from
# the establishment's MCC. GIFT is open: it takes any MCC the brand accepts.
# =====================================
mcc_wallets:
  FOOD: ["5411", "5422", "5441", "5451", "5462", "5499"]
  MEAL: ["5811", "5812", "5814"]
  MOBILITY: ["5541", "5542", "5531", "5532", "5533", "7523", "7542", "7531", "7538", "4111", "4121", "4131"]
  HEALTH: ["5912", "5976", "8011", "8021", "8031", "8041", "8042", "8043", "8049", "8050", "8062", "8071", "8099", "7997"]
  HOME_OFFICE: ["5712", "5722", "5732", "5734", "5045", "4814", "4816"]
  EDUCATION: ["5942", "5943", "8211", "8220", "8241", "8244", "8249", "8299"]
  GIFT: "any"

