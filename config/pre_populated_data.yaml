# Response codes: ISO 8583, the card industry's standard. Descriptions are
# shown to Brazilian users, so they stay in Portuguese. The specific reason
# of a decline is in transactions.decline_reason.
# =====================================
response_codes:
  "00": "Transação aprovada"
  "03": "Estabelecimento inválido"
  "14": "Cartão inválido"
  "15": "Emissor inexistente"
  "46": "Conta encerrada"
  "51": "Saldo insuficiente"
  "54": "Cartão vencido"
  "55": "Senha incorreta"
  "57": "Transação não permitida ao portador"
  "58": "Transação não permitida no terminal"
  "61": "Limite de valor excedido"
  "62": "Cartão restrito"
  "65": "Limite de quantidade excedido"
  "78": "Cartão não desbloqueado"
  "92": "Rota de autorização não encontrada"
  "96": "Erro no sistema"
