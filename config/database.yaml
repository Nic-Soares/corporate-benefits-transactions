oltp_postgres:
  host: "localhost"
  port: 5432
  dbname: "transactions_benefits_db"
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  schema:
    tables: ./database/oltp_postgres/tables.sql

olap_duck:
  engine: duckdb
  file_path: ./database/olap_duck/olap_corporate_benefits.duckdb
  read_only: false
  schema:
    dimensions: ./database/olap_duck/01_dimensions.sql
    entities: ./database/olap_duck/02_entities.sql
    facts: ./database/olap_duck/03_facts.sql
    # views: ./database/olap_duck/04_views.sql

performance:
  memory_limit: 8GB
  threads: 8
