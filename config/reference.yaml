# =====================================
# Capture technologies (transactions.capture_type)
# =====================================
transaction_technologies:
  - code: CHIP
    category: physical
    name: Chip

  - code: MAG_STRIPE
    category: physical
    name: Magnetic Stripe

  - code: CONTACTLESS
    category: physical
    name: Contactless

  - code: MOBILE_NFC
    category: digital
    name: Mobile NFC

  - code: APPLE_PAY
    category: digital
    name: Apple Pay

  - code: GOOGLE_PAY
    category: digital
    name: Google Pay

  - code: ECOMMERCE
    category: digital
    name: E-commerce (card not present)

# Response codes: ISO 8583, the card industry's standard. Descriptions are
# shown to Brazilian users, so they stay in Portuguese. The specific reason
# of a decline is in transactions.decline_reason.
# =====================================
response_codes:
  "00": "Transação aprovada"
  "03": "Estabelecimento inválido"
  "14": "Cartão inválido"
  "15": "Emissor inexistente"
  "46": "Conta encerrada"
  "51": "Saldo insuficiente"
  "54": "Cartão vencido"
  "55": "Senha incorreta"
  "57": "Transação não permitida ao portador"
  "58": "Transação não permitida no terminal"
  "61": "Limite de valor excedido"
  "62": "Cartão restrito"
  "65": "Limite de quantidade excedido"
  "78": "Cartão não desbloqueado"
  "92": "Rota de autorização não encontrada"
  "96": "Erro no sistema"

# =====================================
# Valid statuses per entity (generators draw from these)
# =====================================
status_options:
  cardholder:
    - "active"
    - "inactive"
    - "terminated"

  card:
    - "active"
    - "inactive"
    - "blocked"
    - "cancelled"

  card_wallet:
    - "active"
    - "suspended"
    - "cancelled"

  terminal:
    - "active"
    - "inactive"
    - "maintenance"

  establishment:
    - "active"
    - "inactive"
    - "suspended"
    - "terminated"

# =====================================
# Capture technologies: which need a physical card
# =====================================
# A virtual card only uses the captures that don't need the physical card
# (read by src/simulation/pools.py).
transaction_technology_rules:
  CHIP:
    requires_physical_card: true
    description: "EMV chip - physical card"

  MAG_STRIPE:
    requires_physical_card: true
    description: "Magnetic stripe - physical card"

  CONTACTLESS:
    requires_physical_card: true
    description: "Contactless - physical card"

  MOBILE_NFC:
    requires_physical_card: false
    description: "Mobile NFC - no physical card"

  APPLE_PAY:
    requires_physical_card: false
    description: "Apple Pay - no physical card"

  GOOGLE_PAY:
    requires_physical_card: false
    description: "Google Pay - no physical card"

  ECOMMERCE:
    requires_physical_card: false
    description: "Online purchase - card number and CVV"

