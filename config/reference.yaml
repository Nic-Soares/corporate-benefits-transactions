# =====================================
# reference.yaml
# Reference data: wallets, programs, networks, acquirers, terminal models,
# acceptance rules (CNAE, MCC), capture technologies, response codes, the
# statuses records can have. Loaded into the database by setup (src/reference.py).
# =====================================

# Wallets: the balances a card can hold
# =====================================
wallets:
  - id: "FOOD"
    name: "Alimentação"
    category: "Beneficio"

  - id: "MEAL"
    name: "Refeição"
    category: "Beneficio"

  - id: "MOBILITY"
    name: "Mobilidade"
    category: "Beneficio"

  - id: "HEALTH"
    name: "Saúde e Bem-estar"
    category: "Beneficio"

  - id: "HOME_OFFICE"
    name: "Home Office"
    category: "Beneficio"

  - id: "EDUCATION"
    name: "Educação"
    category: "Beneficio"

  - id: "GIFT"
    name: "Presente"
    category: "Incentivo"

  - id: "PREMIUM"
    name: "Premiação"
    category: "Incentivo"

# =====================================
# Card programs: what a card is. The program fixes the wallets on the card
# and the network it runs on:
#   proprietary_network — 3-party: the issuer's own network authorizes by
#     CNAE, and the cardholder picks the wallet on the terminal
#   brand — 4-party: acquirer → brand → issuer; the issuer picks the wallet
#     from the MCC (wallet_priority in authorization.yaml)
# =====================================
card_programs:
  - id: "FOOD"
    name: "Alimentação"
    network_type: "proprietary_network"
    wallets: ["FOOD"]

  - id: "MEAL"
    name: "Refeição"
    network_type: "proprietary_network"
    wallets: ["MEAL"]

  - id: "MULTI_3P"
    name: "Multibenefícios (rede própria)"
    network_type: "proprietary_network"
    wallets: ["FOOD", "MEAL", "MOBILITY", "HEALTH", "HOME_OFFICE", "EDUCATION", "GIFT"]

  - id: "MULTI_4P"
    name: "Multibenefícios (bandeirado)"
    network_type: "brand"
    brands: ["VISA", "MASTERCARD", "ELO"]
    wallets: ["FOOD", "MEAL", "MOBILITY", "HEALTH", "HOME_OFFICE", "EDUCATION", "GIFT"]

  - id: "GIFT"
    name: "Presente"
    network_type: "proprietary_network"
    wallets: ["GIFT"]

  - id: "PREMIUM"
    name: "Premiação"
    network_type: "proprietary_network"
    wallets: ["PREMIUM"]

  - id: "FUEL"
    name: "Combustível"
    network_type: "proprietary_network"
    wallets: ["MOBILITY"]

# =====================================
# Transaction modalities: the proprietary network and the brands
# =====================================
transaction_modalities:
  - id: "OWN"
    name: "Rede Própria"
    type: "proprietary_network"

  - id: "VISA"
    name: "Visa"
    type: "brand"

  - id: "MASTERCARD"
    name: "Mastercard"
    type: "brand"

  - id: "ELO"
    name: "Elo"
    type: "brand"

# =====================================
# Acquirers
# =====================================
acquirers:
  - id: "CIE"
    name: "Cielo"

  - id: "RED"
    name: "Rede"

  - id: "STO"
    name: "Stone"

  - id: "GET"
    name: "GetNet"

  - id: "PAG"
    name: "PagSeguro"

  - id: "SAF"
    name: "SafraPay"

  - id: "ATM"
    name: "ATM network"   # cash machines shared by the banks

# =====================================
# Terminal models per acquirer (acquirer id → model and type)
# =====================================
terminal_models_by_acquirer:
  # ECOMMERCE: the acquirer's online gateway; ATM: a cash machine
  CIE:
    - model: "LIO V1"
      type: "POS"
    - model: "LIO V2"
      type: "POS"
    - model: "Cielo Flash"
      type: "TEF"
    - model: "Cielo E-commerce"
      type: "ECOMMERCE"

  RED:
    - model: "Pop"
      type: "POS"
    - model: "Flex"
      type: "POS"
    - model: "TEF Dedicado"
      type: "TEF"
    - model: "Rede E-commerce"
      type: "ECOMMERCE"

  STO:
    - model: "Ton T1"
      type: "POS"
    - model: "Ton T2"
      type: "POS"
    - model: "Ton Pro"
      type: "POS"
    - model: "Stone E-commerce"
      type: "ECOMMERCE"

  GET:
    - model: "Smart"
      type: "POS"
    - model: "Touch"
      type: "POS"
    - model: "TEF GetNet"
      type: "TEF"
    - model: "GetNet E-commerce"
      type: "ECOMMERCE"

  PAG:
    - model: "Moderninha Plus"
      type: "POS"
    - model: "Moderninha Pro"
      type: "POS"
    - model: "Moderninha Smart"
      type: "POS"
    - model: "PagSeguro E-commerce"
      type: "ECOMMERCE"

  SAF:
    - model: "Safra Mobile"
      type: "POS"
    - model: "Safra Touch"
      type: "POS"
    - model: "Safra TEF"
      type: "TEF"

  ATM:
    - model: "Cash machine"
      type: "ATM"

# CNAE × wallets: what the proprietary network accepts at each establishment
# =====================================
cnae_wallets:
  # Longest prefix wins: a 7-digit subclass entry overrides its 4-digit class,
  # so each entry lists every wallet accepted at that level.

  # Supermarkets and hypermarkets
  "4711": ["FOOD", "GIFT", "PREMIUM"]
  "4691": ["FOOD", "GIFT"]       # cash-and-carry food wholesale

  # Food retail
  "4721": ["FOOD", "GIFT"]       # bakeries, dairy, cold cuts
  "4722": ["FOOD", "GIFT"]       # butchers, fishmongers
  "4723": ["FOOD", "GIFT"]       # beverages
  "4724": ["FOOD", "GIFT"]       # fruit and vegetables
  "4729": ["FOOD", "GIFT"]       # other food

  # Restaurants and food services
  "5611": ["MEAL", "GIFT"]       # restaurants, snack bars, bars
  "5612": ["MEAL"]               # street food
  "5620": ["MEAL"]               # catering and canteens

  # Mobility
  "4731": ["MOBILITY"]           # fuel stations
  "4520": ["MOBILITY"]           # vehicle repair and car wash
  "4530": ["MOBILITY"]           # vehicle parts
  "5223": ["MOBILITY"]           # parking

  # Health and wellness
  "4771": ["HEALTH", "GIFT", "PREMIUM"]  # pharmacies
  "4773": ["HEALTH"]             # medical and orthopedic items
  "4774": ["HEALTH", "PREMIUM"]  # optical goods
  "8630": ["HEALTH"]             # outpatient care
  "9313": ["HEALTH"]             # gyms

  # Home office
  "4751": ["HOME_OFFICE", "GIFT", "PREMIUM"]  # IT equipment
  "4752": ["HOME_OFFICE", "GIFT", "PREMIUM"]  # telecom equipment
  "4753": ["HOME_OFFICE", "GIFT", "PREMIUM"]  # home appliances
  "4754": ["HOME_OFFICE", "GIFT", "PREMIUM"]  # furniture and lighting

  # Education
  "4761": ["EDUCATION", "GIFT", "PREMIUM"]    # books, stationery
  "8599": ["EDUCATION"]          # courses and training

  # General retail
  "4755": ["GIFT", "PREMIUM"]    # textiles and household linen
