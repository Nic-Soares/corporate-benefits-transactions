# =====================================
# REGRAS DE NEGÓCIO PARA ACEITAÇÃO DE PRODUTOS
# =====================================

# REGRAS PARA VALE ALIMENTAÇÃO (VA):
# - Aceito APENAS em estabelecimentos que vendem alimentos para preparo doméstico
# - Supermercados, hipermercados, açougues, padarias, feiras
# - NÃO aceito em restaurantes, lanchonetes ou estabelecimentos de refeição pronta
# - Lojas de conveniência podem aceitar para produtos alimentícios específicos

# REGRAS PARA VALE REFEIÇÃO (VR):
# - Aceito APENAS em estabelecimentos que servem refeições prontas
# - Restaurantes, lanchonetes, bares, food trucks, cantinas
# - Serviços de catering e bufê para eventos
# - NÃO aceito em supermercados ou estabelecimentos de venda de alimentos para preparo

# REGRAS PARA VALE COMBUSTÍVEL (VC):
# - Aceito EXCLUSIVAMENTE em postos de combustível
# - Gasolina, álcool, diesel, GNV
# - Pode incluir serviços relacionados como lavagem e lubrificação

# REGRAS PARA CARTÃO GF (GF):
# - Aceito em diversos estabelecimentos para compras de presentes e bonificações
# - Supermercados, lojas de departamento, farmácias, vestuário, eletrônicos
# - Usado como incentivo, premiação ou presente
# - Flexibilidade maior que outros benefícios, mas com controles específicos
