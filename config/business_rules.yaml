# Regras por tipo de produto + CNAE
tipos_produto:
  alimentacao:
    name: "Vale Alimentação"
    code: "VA"
    category: "Beneficio"
    cnaes_permitidos: ["4711-3", "4712-1"]

  refeicao:
    name: "Vale Refeição"
    code: "VR"
    category: "Beneficio"
    cnaes_permitidos: ["5611-2", "5612-1"]

  combustivel:
    name: "Vale Combustível"
    code: "VC"
    category: "Beneficio"
    cnaes_permitidos: ["4731-8"]

  frota:
    name: "Gestão de Frota"
    code: "FR"
    category: "Gestão"
    cnaes_permitidos: ["4731-8"]

  gift:
    name: "Vale Presente"
    code: "GF"
    category: "Beneficio"
    cnaes_permitidos: "todos"  # Aceita qualquer CNAE

