# =====================================
# business_rules.yaml
# Business rules and operating settings
# =====================================

# =====================================
# Product acceptance, by establishment category
# =====================================
# Not read by the code yet: the CNAE rule (pre_populated_data.yaml → cnae_products) is
# what authorizes; this is the business description of it.
product_acceptance_rules:
  VA:
    name: "Vale Alimentação"
    description: "Groceries only (food prepared at home)"
    allowed_categories:
      - "supermercados"
      - "hipermercados"
      - "acougues"
      - "padarias"
      - "feiras"
      - "comercio_alimenticio"
    forbidden_categories:
      - "restaurantes"
      - "lanchonetes"
      - "bares"

  VR:
    name: "Vale Refeição"
    description: "Ready meals only"
    allowed_categories:
      - "restaurantes"
      - "lanchonetes"
      - "bares"
      - "cantinas"
      - "catering"
      - "bufe"
    forbidden_categories:
      - "supermercados"
      - "hipermercados"
      - "comercio_alimenticio"

  VC:
    name: "Vale Combustível"
    description: "Fuel stations only"
    allowed_categories:
      - "postos_combustivel"
    allowed_services:
      - "gasolina"
      - "alcool"
      - "diesel"
      - "gnv"

  VF:
    name: "Vale Farmácia"
    description: "Accepted at pharmacies only"
    allowed_categories:
      - "farmacias"

  VM:
    name: "Multibenefícios"
    description: "One balance accepted wherever VA, VR or VF is"
    allowed_categories:
      - "supermercados"
      - "comercio_alimenticio"
      - "restaurantes"
      - "lanchonetes"
      - "farmacias"

  PR:
    name: "Premiação"
    description: "Incentive or award balance, accepted across retail"
    allowed_categories:
      - "supermercados"
      - "restaurantes"
      - "farmacias"
      - "lojas_departamento"
      - "vestuario"
      - "eletronicos"
      - "varejo_geral"

# =====================================
# Commission (MDR) per modality
# =====================================
# Not read by the code yet (EP-07).
commission_rules:
  OWN:
    commission_rate: 0.0
    description: "Proprietary network - no commission"

  VISA:
    commission_rate: 0.025
    description: "Visa - 2.5%"

  MASTERCARD:
    commission_rate: 0.023
    description: "Mastercard - 2.3%"

  ELO:
    commission_rate: 0.020
    description: "Elo - 2.0%"

# =====================================
# Valid statuses per entity (generators draw from these)
# =====================================
status_options:
  cardholder:
    - "active"
    - "inactive"
    - "terminated"

  card:
    - "active"
    - "inactive"
    - "blocked"
    - "cancelled"

  card_product:
    - "active"
    - "suspended"
    - "cancelled"

  terminal:
    - "active"
    - "inactive"
    - "maintenance"

  establishment:
    - "active"
    - "inactive"
    - "suspended"
    - "terminated"

# =====================================
# Capture technologies: which need a physical card
# =====================================
# Not read by the code yet (EP-07).
transaction_technology_rules:
  CHIP:
    requires_physical_card: true
    description: "EMV chip - physical card"

  MAG_STRIPE:
    requires_physical_card: true
    description: "Magnetic stripe - physical card"

  CONTACTLESS:
    requires_physical_card: true
    description: "Contactless - physical card"

  MOBILE_NFC:
    requires_physical_card: false
    description: "Mobile NFC - no physical card"

  APPLE_PAY:
    requires_physical_card: false
    description: "Apple Pay - no physical card"

  GOOGLE_PAY:
    requires_physical_card: false
    description: "Google Pay - no physical card"
