# =====================================
# business_rules.yaml
# REGRAS DE NEGÓCIO E CONFIGURAÇÕES OPERACIONAIS
# =====================================

# =====================================
# REGRAS DE ACEITAÇÃO DE PRODUTOS
# =====================================
product_acceptance_rules:
  VA:
    name: "Vale Alimentação"
    description: "Aceito apenas para alimentos de preparo doméstico"
    allowed_categories:
      - "supermercados"
      - "hipermercados"
      - "acougues"
      - "padarias"
      - "feiras"
      - "comercio_alimenticio"
    forbidden_categories:
      - "restaurantes"
      - "lanchonetes"
      - "bares"

  VR:
    name: "Vale Refeição"
    description: "Aceito apenas para refeições prontas"
    allowed_categories:
      - "restaurantes"
      - "lanchonetes"
      - "bares"
      - "cantinas"
      - "catering"
      - "bufe"
    forbidden_categories:
      - "supermercados"
      - "hipermercados"
      - "comercio_alimenticio"

  VC:
    name: "Vale Combustível"
    description: "Aceito exclusivamente em postos de combustível"
    allowed_categories:
      - "postos_combustivel"
    allowed_services:
      - "gasolina"
      - "alcool"
      - "diesel"
      - "gnv"

  GF:
    name: "Vale Presente"
    description: "Aceito em estabelecimentos diversos para presentes"
    allowed_categories:
      - "supermercados"
      - "lojas_departamento"
      - "farmacias"
      - "vestuario"
      - "eletronicos"
      - "varejo_geral"

# =====================================
# REGRAS DE COMISSÃO
# =====================================
commission_rules:
  OWN:
    commission_rate: 0.0
    description: "Rede própria - sem comissão"

  VISA:
    commission_rate: 0.025
    description: "Bandeira Visa - 2.5%"

  MASTERCARD:
    commission_rate: 0.023
    description: "Bandeira Mastercard - 2.3%"

  ELO:
    commission_rate: 0.020
    description: "Bandeira Elo - 2.0%"

# =====================================
# STATUS DISPONÍVEIS
# =====================================
status_options:
  cardholder:
    - "active"
    - "inactive"
    - "terminated"

  card:
    - "active"
    - "blocked"
    - "cancelled"

  establishment:
    - "active"
    - "inactive"
    - "suspended"
    - "terminated"

# =====================================
# REGRAS DE TECNOLOGIAS DE TRANSAÇÃO
# =====================================
transaction_technology_rules:
  CHIP:
    requires_physical_card: true
    description: "Transação com chip EMV - requer cartão físico"

  MAG_STRIPE:
    requires_physical_card: true
    description: "Transação com tarja magnética - requer cartão físico"

  CONTACTLESS:
    requires_physical_card: true
    description: "Transação por aproximação - requer cartão físico"

  MOBILE_NFC:
    requires_physical_card: false
    description: "Transação via NFC móvel - não requer cartão físico"

  APPLE_PAY:
    requires_physical_card: false
    description: "Transação via Apple Pay - não requer cartão físico"

  GOOGLE_PAY:
    requires_physical_card: false
    description: "Transação via Google Pay - não requer cartão físico"
