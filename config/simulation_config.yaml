# =====================================
# transaction_simulation.yaml
# Configurações e parâmetros para simulação transacional
# =====================================

# VOLUMES DE DADOS A GERAR
data_volumes:
  companies: 15
  cardholders: 1200
  cards: 2400
  establishments: 150
  terminals: 300
  card_products: 3000
  transactions: 100


# DISTRIBUIÇÕES DE APROVAÇÃO
approval_rates:
  overall: 0.92                  # 92% de aprovação geral
  by_network:
    proprietary_network: 0.95    # 95% rede própria
    branded_network: 0.88        # 88% rede bandeirada
  by_product:
    VA: 0.94                     # Vale alimentação
    VR: 0.93                     # Vale refeição
    VC: 0.89                     # Vale combustível
    VF: 0.96                     # Vale farmácia
    VM: 0.90                     # Vale múltiplo
    PR: 0.91                     # Premium

# CONFIGURAÇÕES DE GERAÇÃO
generation_settings:
  # Distribuição de CNAEs com produtos válidos
  cnae_with_products_ratio: 0.85  # 85% dos estabelecimentos devem ter CNAE que aceita produtos
  
  # Distribuição de status
  cardholder_status_distribution:
    active: 0.85
    inactive: 0.10
    terminated: 0.05

  card_status_distribution:
    active: 0.80
    blocked: 0.15
    cancelled: 0.05

  establishment_status_distribution:
    ATIVA: 0.90
    INATIVA: 0.07
    SUSPENSA: 0.02
    BAIXADA: 0.01

  # Produtos por cartão
  products_per_card:
    min: 1
    max: 3
    avg: 1.8

  # Datas
  date_ranges:
    card_issuance:
      start: "-2y"
      end: "today"
    cardholder_admission:
      start: "-5y"
      end: "today"
    company_registration:
      start: "-10y"
      end: "today"
    establishment_opening:
      start: "-8y"
      end: "today"


# PADRÕES DE USO
usage_patterns:
  # Horários mais comuns por tipo de estabelecimento
  peak_hours_by_category:
    restaurant: [12, 13, 18, 19, 20]
    supermarket: [10, 11, 17, 18, 19]
    gas_station: [7, 8, 17, 18, 19]
    pharmacy: [9, 10, 11, 15, 16, 17]

  # Valores médios por produto
  average_amounts:
    VA:
      min: 15.00
      max: 250.00
      avg: 65.00
    VR:
      min: 8.00
      max: 700.00
      avg: 28.50
    VC:
      min: 30.00
      max: 500.00
      avg: 180.00
    VF:
      min: 5.00
      max: 200.00
      avg: 42.00
    VM:
      min: 10.00
      max: 300.00
      avg: 75.00
    PR:
      min: 20.00
      max: 800.00
      avg: 150.00
