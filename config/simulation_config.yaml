# =====================================
# simulation_config.yaml
# Parameters of the data generation and the transaction simulation
# =====================================

# Volumes to generate — Not read by the code yet (EP-06)
data_volumes:
  companies: 15
  cardholders: 1200
  cards: 2400
  establishments: 150
  terminals: 300
  card_products: 3000
  transactions: 100


# Target approval rates — Not read by the code yet (EP-07)
approval_rates:
  overall: 0.92                  # 92% approved overall
  by_network:
    proprietary_network: 0.95    # proprietary network
    branded_network: 0.88        # branded networks
  by_product:
    VA: 0.94                     # Vale Alimentação
    VR: 0.93                     # Vale Refeição
    VC: 0.89                     # Vale Combustível
    VF: 0.96                     # Vale Farmácia
    VM: 0.90                     # Multibenefícios
    PR: 0.91                     # Premiação

# Data generation (read by src/data_generators/providers/fake.py)
generation_settings:
  cnae_with_products_ratio: 0.85  # share of establishments whose CNAE accepts some product
  
  # Status weights (valid statuses: business_rules.yaml → status_options)
  company_status_distribution:
    active: 0.90
    inactive: 0.07
    suspended: 0.03

  cardholder_status_distribution:
    active: 0.85
    inactive: 0.10
    terminated: 0.05

  card_status_distribution:
    active: 0.80
    inactive: 0.05
    blocked: 0.10
    cancelled: 0.05

  card_product_status_distribution:
    active: 0.70
    suspended: 0.15
    cancelled: 0.15

  establishment_status_distribution:
    active: 0.90
    inactive: 0.07
    suspended: 0.02
    terminated: 0.01

  terminal_status_distribution:
    active: 0.90
    inactive: 0.05
    maintenance: 0.05

  # Products per card
  products_per_card:
    min: 1
    max: 3
    avg: 1.8

  # Dates
  date_ranges:
    card_issuance:
      start: "-2y"
      end: "today"
    cardholder_admission:
      start: "-5y"
      end: "today"
    company_registration:
      start: "-10y"
      end: "today"
    establishment_opening:
      start: "-8y"
      end: "today"
  # Each date also starts no earlier than its parent's: admission ≥ company
  # registration, card issue ≥ admission, product activation ≥ card issue,
  # terminal installation ≥ establishment accreditation.
  card_validity_years:
    min: 3
    max: 5


# Usage patterns — Not read by the code yet (EP-07)
usage_patterns:
  # Peak hours per establishment category
  peak_hours_by_category:
    restaurant: [12, 13, 18, 19, 20]
    supermarket: [10, 11, 17, 18, 19]
    gas_station: [7, 8, 17, 18, 19]
    pharmacy: [9, 10, 11, 15, 16, 17]

  # Transaction amounts per product
  average_amounts:
    VA:
      min: 15.00
      max: 250.00
      avg: 65.00
    VR:
      min: 8.00
      max: 700.00
      avg: 28.50
    VC:
      min: 30.00
      max: 500.00
      avg: 180.00
    VF:
      min: 5.00
      max: 200.00
      avg: 42.00
    VM:
      min: 10.00
      max: 300.00
      avg: 75.00
    PR:
      min: 20.00
      max: 800.00
      avg: 150.00
