services:
  db:
    image: postgres:18
    container_name: corporate_benefits_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: transactions_benefits_db
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ keeps its data in a versioned subfolder of /var/lib/postgresql
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
    name: corporate_benefits_postgres_data
