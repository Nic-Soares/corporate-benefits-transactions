services:
  db:
    image: postgres:18
    container_name: corporate_benefits_db
    # Local development defaults; .env overrides them
    environment:
      POSTGRES_USER: ${DB_USER:-benefits}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: transactions_benefits_db
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ keeps its data in a versioned subfolder of /var/lib/postgresql
      - postgres_data:/var/lib/postgresql
    # Ready only after the init process restarts the server: `docker compose up --wait` waits for it
    healthcheck:
      # Over TCP: the temporary init server listens on the socket only
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres_data:
    name: corporate_benefits_postgres_data
